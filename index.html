    <script>
        // Tema, özel renk paleti ve dil (sayfa çizilmeden önce çalışır)
        (function () {
            const d = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isLight = savedTheme === 'light' || (!savedTheme && !systemPrefersDark);
            if (isLight) d.classList.add('light-mode');
            const a = localStorage.getItem('custom_accent');
            const t = localStorage.getItem('custom_text');
            const b = localStorage.getItem('custom_bg');
            if (a) d.style.setProperty('--accent-color', a);
            if (t) d.style.setProperty('--text-color', t);
            if (b) {
                d.style.setProperty('--bg-color', b);
                d.style.setProperty('--card-bg', b);
            }
            // Özel arka plan var, yazı rengi seçilmemişse okunabilir renkleri zeminin açıklığına göre seç
            if (b && !t) {
                const m = /^#([0-9a-f]{6})$/i.exec(b.trim());
                if (m) {
                    const n = parseInt(m[1], 16);
                    const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
                    const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
                    const bgIsLight = L > 0.18;
                    d.style.setProperty('--text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    d.style.setProperty('--text-muted', bgIsLight ? '#475569' : '#cbd5e1');
                    d.style.setProperty('--border-color', bgIsLight ? 'rgba(15,23,42,0.18)' : 'rgba(248,250,252,0.22)');
                }
            }
            // Safari üst/alt çubuğu sayfa zemin rengine uysun
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', b || (isLight ? '#f8fafc' : '#0f172a'));

            // Dil ve yön
            const lang = localStorage.getItem('user_lang') || 'tr';
            d.setAttribute('lang', lang);
            d.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        })();
    </script>

        },

            result_default_desc: "أدخل الأسعار وأصولك للحساب.",
            need_price_gold: "أدخل سعر جرام الذهب الحالي أولاً.", need_price_silver: "أدخل سعر جرام الفضة الحالي أولاً (النصاب بالفضة مختار).",
            need_gold_price_for_gold: "أدخلت ذهباً؛ أدخل سعر جرام الذهب لتقييمه.",
            need_silver_price_for_silver: "أدخلت فضة؛ أدخل سعر جرام الفضة لتقييمها.",
            bd_gold: "قيمة الذهب", bd_silver: "قيمة الفضة", bd_cash: "النقد / البنك", bd_forex: "عملات / أخرى", bd_commercial: "عروض التجارة",
            bd_investments: "أسهم / صناديق", bd_receivables: "الديون المرجوّة", bd_total: "إجمالي الأصول", bd_debts: "الديون (−)", bd_net: "صافي المال الزكوي",
            bd_nisab_gold: "النصاب (80.18 غ ذهب)", bd_nisab_silver: "النصاب (561 غ فضة)",
            res_over: "صافي أصولك يتجاوز النصاب. إن مرّ عليه حول هجري فتجب الزكاة (2.5%).",
            res_under: "صافي أصولك دون النصاب؛ لا زكاة عليك.",
            disclaimer: "هذه الأداة مساعدة للحساب وليست فتوى. الحاجات الأساسية كمسكنك ومركبتك وأثاث بيتك لا زكاة فيها. للحالات الخاصة استشر عالماً أو مفتياً.",
            footer_text: "آية الوقت • وحدة حساب الزكاة", cur: "ليرة"
        }
    };
    const lang = translations[localStorage.getItem('user_lang')] ? localStorage.getItem('user_lang') : 'tr';
    const T = translations[lang];

    // <PURE>
    const NISAB_GOLD_G = 80.18;     // Diyanet / TDV: 20 miskal
    const NISAB_SILVER_G = 561;     // Diyanet: gümüş nisabı
    const ZAKAT_RATE = 0.025;       // kırkta bir

    // "1.234.567,89" -> 1234567.89
    function parseTR(str) {
        if (!str) return 0;
        const n = parseFloat(String(str).replace(/\./g, '').replace(',', '.'));
        return (isNaN(n) || n < 0) ? 0 : n;
    }

    // Yazılan metni binlik ayraçlı biçime çevirir; virgülden sonra en fazla maxDec hane
    function formatTR(raw, maxDec) {
        let s = String(raw).replace(/[^\d,]/g, '');
        const first = s.indexOf(',');
        if (first !== -1) s = s.slice(0, first + 1) + s.slice(first + 1).replace(/,/g, '');
        let [ip, dp] = s.split(',');
        ip = ip.replace(/^0+(?=\d)/, '').slice(0, 13);
        ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        return dp !== undefined ? ip + ',' + dp.slice(0, maxDec) : ip;
    }

    // Ana hesap: tüm varlıklar, borçlar, nisap ve zekât
    function computeZakat(i) {
        const goldValue = i.goldGrams * i.goldPrice;
        const silverValue = i.silverGrams * i.silverPrice;
        const total = i.cash + i.forex + goldValue + silverValue + i.commercial + i.investments + i.receivables;
        const net = Math.max(0, total - i.debts);
        const nisabTL = i.basis === 'silver' ? NISAB_SILVER_G * i.silverPrice : NISAB_GOLD_G * i.goldPrice;
        const over = nisabTL > 0 && net >= nisabTL;
        // Zekât, nisabı aşan TOPLAM net varlığın %2,5'idir (yalnızca fazlasının değil)
        return { goldValue, silverValue, total, net, nisabTL, over, zakat: over ? net * ZAKAT_RATE : 0 };
    }
    // </PURE>

    // ===================== TEMA =====================
    function updateThemeButton() {
        document.getElementById('theme-btn').textContent = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
    }
    // Safari üst/alt çubuğu sayfa zemin rengine uysun
    function updateThemeColor() {
        const meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) return;
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
        if (bg) meta.setAttribute('content', bg);
    }
    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        updateThemeButton();
        updateThemeColor();
    }

    // ===================== GİRİŞ BİÇİMLENDİRME =====================
    // DÜZELTME: Ondalık (virgüllü) sayı girilebilir; imleç konumu korunur; "." tuşu ondalık ayraç sayılır
    function handleInput(e) {
        const input = e.target;
        const maxDec = input.dataset.money === '1' ? 2 : 2;
        let val = input.value, pos = input.selectionStart;
        if (e.inputType === 'insertText' && e.data === '.' && pos > 0 && val[pos - 1] === '.') {
            val = val.slice(0, pos - 1) + ',' + val.slice(pos);
        }
        const significantBefore = val.slice(0, pos).replace(/[^\d,]/g, '').length;
        const formatted = formatTR(val, maxDec);
        input.value = formatted;
        let count = 0, newPos = formatted.length;
        for (let k = 0; k < formatted.length; k++) {
            if (count === significantBefore) { newPos = k; break; }
            if (/[\d,]/.test(formatted[k])) count++;
        }
        if (count < significantBefore) newPos = formatted.length;
        try { input.setSelectionRange(newPos, newPos); } catch (err) { /* bazı tarayıcılarda desteklenmez */ }
        if (input.id === 'gold-price' || input.id === 'silver-price') savePrices();
        scheduleCalc();
    }

    // ===================== FİYAT KAYDI =====================
    function savePrices() {
        try {
            localStorage.setItem('zekat_gold_price', document.getElementById('gold-price').value);
            localStorage.setItem('zekat_silver_price', document.getElementById('silver-price').value);
            localStorage.setItem('zekat_price_date', String(Date.now()));
        } catch (e) { /* kota */ }
        updatePriceNote();
    }
    function updatePriceNote() {
        const note = document.getElementById('price-note');
        const ts = parseInt(localStorage.getItem('zekat_price_date'), 10);
        const days = ts ? Math.floor((Date.now() - ts) / 86400000) : 0;
        const hasPrice = parseTR(document.getElementById('gold-price').value) > 0 || parseTR(document.getElementById('silver-price').value) > 0;
        if (hasPrice && days >= 7) { note.textContent = T.price_old.replace('{d}', days); note.classList.add('warn'); }
        else { note.textContent = T.price_note; note.classList.remove('warn'); }
    }

    // ===================== HESAPLA / GÖSTER =====================
    let calcTimer = null;
    function scheduleCalc() { clearTimeout(calcTimer); calcTimer = setTimeout(calculateZakat, 250); }

    const fmtMoney = n => n.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const val = id => parseTR(document.getElementById(id).value);

    function calculateZakat() {
        const basis = document.getElementById('nisab-basis').value;
        const input = {
            goldPrice: val('gold-price'), silverPrice: val('silver-price'), basis,
            cash: val('cash'), forex: val('forex'), goldGrams: val('gold-amount'), silverGrams: val('silver-amount'),
            commercial: val('commercial'), investments: val('investments'), receivables: val('receivables'), debts: val('debts')
        };
        const amountEl = document.getElementById('zakat-amount'), descEl = document.getElementById('total-assets-desc'), bd = document.getElementById('breakdown');

        // DÜZELTME: Fiyat girilmeden sessizce 3.000 TL varsayılmaz; kullanıcı uyarılır
        let missing = '';
        if (basis === 'gold' && input.goldPrice <= 0) missing = T.need_price_gold;
        else if (basis === 'silver' && input.silverPrice <= 0) missing = T.need_price_silver;
        else if (input.goldGrams > 0 && input.goldPrice <= 0) missing = T.need_gold_price_for_gold;
        else if (input.silverGrams > 0 && input.silverPrice <= 0) missing = T.need_silver_price_for_silver;
        if (missing) {
            amountEl.textContent = '—'; descEl.textContent = missing; descEl.classList.add('warn'); bd.style.display = 'none';
            return;
        }
        descEl.classList.remove('warn');

        const r = computeZakat(input);
        amountEl.textContent = fmtMoney(r.zakat) + ' ' + T.cur;
        descEl.textContent = r.over ? T.res_over : T.res_under;

        const rows = [
            [T.bd_cash, input.cash], [T.bd_forex, input.forex], [T.bd_gold, r.goldValue], [T.bd_silver, r.silverValue],
            [T.bd_commercial, input.commercial], [T.bd_investments, input.investments], [T.bd_receivables, input.receivables]
        ].filter(x => x[1] > 0);
        let html = rows.map(x => `<div class="bd-row"><span>${x[0]}</span><b>${fmtMoney(x[1])} ${T.cur}</b></div>`).join('');
        html += `<div class="bd-row total"><span>${T.bd_total}</span><b>${fmtMoney(r.total)} ${T.cur}</b></div>`;
        if (input.debts > 0) html += `<div class="bd-row"><span>${T.bd_debts}</span><b>− ${fmtMoney(input.debts)} ${T.cur}</b></div>`;
        html += `<div class="bd-row total"><span>${T.bd_net}</span><b>${fmtMoney(r.net)} ${T.cur}</b></div>`;
        html += `<div class="bd-row"><span>${basis === 'silver' ? T.bd_nisab_silver : T.bd_nisab_gold}</span><b>${fmtMoney(r.nisabTL)} ${T.cur}</b></div>`;
        bd.innerHTML = html; bd.style.display = 'flex';
    }

    // ===================== BAŞLATMA =====================
    window.onload = () => {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (T[key] !== undefined && el.tagName !== 'TITLE') el.textContent = T[key];
        });
        document.querySelectorAll('[data-i18n-title]').forEach(el => {
            const key = el.getAttribute('data-i18n-title');
            if (T[key]) { el.title = T[key]; el.setAttribute('aria-label', T[key]); }
        });
        document.title = T.page_title;
        updateThemeButton();
        updateThemeColor();

        document.querySelectorAll('input[data-money]').forEach(inp => inp.addEventListener('input', handleInput));
        document.getElementById('gold-price').value = localStorage.getItem('zekat_gold_price') || '';
        document.getElementById('silver-price').value = localStorage.getItem('zekat_silver_price') || '';
        updatePriceNote();
        calculateZakat();
    };
</script>
